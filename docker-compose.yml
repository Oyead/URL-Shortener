version: '3.8'

services:
  # ---------------------------------------------------------------------------
  # MongoDB Service (Document Database)
  # ---------------------------------------------------------------------------
  mongo:
    image: mongo:latest
    container_name: local-mongo
    restart: always
    ports:
      - "27017:27017"
    environment:
      # Fixes MongoDB startup crash on Linux Kernels 6.19+
      - GLIBC_TUNABLES=glibc.pthread.rseq=1
      # Optional: Root credentials (uncomment if you want auth enabled)
      # - MONGO_INITDB_ROOT_USERNAME=root
      # - MONGO_INITDB_ROOT_PASSWORD=secret
    volumes:
      - mongo_data:/data/db

  # ---------------------------------------------------------------------------
  # Redis Service (Key-Value Store / Cache)
  # ---------------------------------------------------------------------------
  redis:
    image: redis:latest
    container_name: local-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

# -----------------------------------------------------------------------------
# Persistent Volumes (Keeps data intact across container restarts)
# -----------------------------------------------------------------------------
volumes:
  mongo_data:
  redis_data: